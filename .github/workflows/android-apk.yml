name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          rm -rf www && mkdir www
          cp -r index.html css js assets icons manifest.webmanifest sw.js www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over old versions and keep data)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurfMitra-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish download link (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TurfMitra-demo.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "TurfMitra demo APK (Android)" --notes "Latest Android demo build by JNMSoftwares. Download TurfMitra-demo.apk and install."
          gh release upload apk-latest TurfMitra-demo.apk --clobber
